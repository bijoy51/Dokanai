name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        # AUTH_SECRET is required in production; a throwaway value lets the
        # build's page-data collection run in CI. Real secrets live in Vercel.
        env:
          AUTH_SECRET: ci-build-verify-only
        run: npm run build
